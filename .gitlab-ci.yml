stages:
  - check
  - publish

check:
  image: node:latest
  stage: check
  script:
    - make dependencies
    - make lint
    - make test

publish:
  image: node:latest
  stage: publish
  only:
    - tags
  script:
    - make dependencies
    - make lint
    - make test
    - npm install -g vsce
    - vsce publish -p "${GITLAB_VSCE_PAN}"
